<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lumen Pop</title>
    
    <!-- Path updated to your newly renamed logo -->
    <link rel="icon" type="image/png" href="assets/logos/logo.png">
    <link rel="apple-touch-icon" href="assets/logos/logo.png">
    
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #10052b; overflow: hidden; touch-action: none;
            color: #ffffff; font-family: -apple-system, sans-serif;
        }
        canvas { display: block; margin: 0 auto; }
        
        #debug-log {
            position: absolute; top: 10px; left: 10px; right: 10px;
            background: rgba(185, 28, 28, 0.95); color: white;
            padding: 15px; border-radius: 12px; font-weight: bold;
            font-size: 15px; z-index: 99999; display: none; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            line-height: 1.5;
        }
    </style>

    <script>
        window.addEventListener('error', function(e) {
            var log = document.getElementById('debug-log');
            if(log) {
                log.style.display = 'block';
                log.innerHTML += `⚠️ <b>JavaScript Error:</b> ${e.message}<br><small>File: ${e.filename}<br>Line: ${e.lineno}</small><hr>`;
            }
        });
    </script>
</head>
<body>
    <div id="debug-log"></div>

    <!-- Phaser 3 Engine (crossorigin added to unmask hidden errors) -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js" crossorigin="anonymous"
            onerror="document.getElementById('debug-log').style.display='block'; document.getElementById('debug-log').innerHTML+='❌ Failed to load Phaser engine from internet.<hr>'"></script>
    
    <!-- Game Modules mapped safely to your js/ folder -->
    <script src="js/config.js" onerror="document.getElementById('debug-log').style.display='block'; document.getElementById('debug-log').innerHTML+='❌ 404: js/config.js not found!<hr>'"></script>
    <script src="js/audio.js" onerror="document.getElementById('debug-log').style.display='block'; document.getElementById('debug-log').innerHTML+='❌ 404: js/audio.js not found!<hr>'"></script>
    <script src="js/graphics.js" onerror="document.getElementById('debug-log').style.display='block'; document.getElementById('debug-log').innerHTML+='❌ 404: js/graphics.js not found!<hr>'"></script>
    <script src="js/logic.js" onerror="document.getElementById('debug-log').style.display='block'; document.getElementById('debug-log').innerHTML+='❌ 404: js/logic.js not found!<hr>'"></script>
    <script src="js/levels.js" onerror="document.getElementById('debug-log').style.display='block'; document.getElementById('debug-log').innerHTML+='❌ 404: js/levels.js not found!<hr>'"></script>
    <script src="js/main.js" onerror="document.getElementById('debug-log').style.display='block'; document.getElementById('debug-log').innerHTML+='❌ 404: js/main.js not found!<hr>'"></script>
</body>
</html>
