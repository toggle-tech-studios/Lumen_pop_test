<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lumen Pop</title>
    
    <link rel="icon" type="image/png" href="assets/logos/Lumen%20Pop%20main%20logo.png">
    <link rel="apple-touch-icon" href="assets/logos/Lumen%20Pop%20main%20logo.png">
    
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #10052b; overflow: hidden; touch-action: none;
            color: #ffffff; font-family: -apple-system, sans-serif;
        }
        canvas { display: block; margin: 0 auto; }
        
        /* Debug Console overlay for iPad */
        #debug-log {
            position: absolute; top: 10px; left: 10px; right: 10px;
            background: rgba(185, 28, 28, 0.95); color: white;
            padding: 15px; border-radius: 12px; font-weight: bold;
            font-size: 15px; z-index: 99999; display: none; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            line-height: 1.5;
        }
    </style>

    <!-- 1. CATCH ALL ERRORS AND PRINT TO SCREEN -->
    <script>
        window.addEventListener('error', function(e) {
            var log = document.getElementById('debug-log');
            if(log) {
                log.style.display = 'block';
                log.innerHTML += `⚠️ <b>JavaScript Error:</b> ${e.message}<br><small>File: ${e.filename}<br>Line: ${e.lineno}</small><hr>`;
            }
        });
    </script>
</head>
<body>
    <div id="debug-log"></div>

    <!-- 2. PHASER FRAMEWORK -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js" 
            onerror="document.getElementById('debug-log').style.display='block'; document.getElementById('debug-log').innerHTML+='❌ Failed to load Phaser engine from internet.<hr>'"></script>
    
    <!-- 3. GAME FILES (Loaded at the bottom of the body to ensure safe DOM access) -->
    <script src="config.js" onerror="document.getElementById('debug-log').style.display='block'; document.getElementById('debug-log').innerHTML+='❌ 404: config.js is missing or spelled wrong in GitHub!<hr>'"></script>
    <script src="audio.js" onerror="document.getElementById('debug-log').style.display='block'; document.getElementById('debug-log').innerHTML+='❌ 404: audio.js is missing or spelled wrong in GitHub!<hr>'"></script>
    <script src="graphics.js" onerror="document.getElementById('debug-log').style.display='block'; document.getElementById('debug-log').innerHTML+='❌ 404: graphics.js is missing or spelled wrong in GitHub!<hr>'"></script>
    <script src="logic.js" onerror="document.getElementById('debug-log').style.display='block'; document.getElementById('debug-log').innerHTML+='❌ 404: logic.js is missing or spelled wrong in GitHub!<hr>'"></script>
    <script src="levels.js" onerror="document.getElementById('debug-log').style.display='block'; document.getElementById('debug-log').innerHTML+='❌ 404: levels.js is missing or spelled wrong in GitHub!<hr>'"></script>
    <script src="main.js" onerror="document.getElementById('debug-log').style.display='block'; document.getElementById('debug-log').innerHTML+='❌ 404: main.js is missing or spelled wrong in GitHub!<hr>'"></script>

</body>
</html>
